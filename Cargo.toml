[workspace]
resolver = "2"
members = [
    "crates/jabr-engine-core",
    "crates/jabr-engine-adapter-math",
    "vendor/civilkit-calcs/calcpad-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
