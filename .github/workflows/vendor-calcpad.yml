name: Import pinned CivilKit Calcpad core

on:
  push:
    branches:
      - feat/civilkit-calcpad-vendoring
    paths:
      - .github/workflows/vendor-calcpad.yml
      - scripts/vendor-calcpad.sh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-calcpad-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jabr Engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Import pinned upstream source
        run: bash scripts/vendor-calcpad.sh

      - name: Commit vendored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/civilkit-calcs
          if git diff --cached --quiet; then
            echo "Pinned Calcpad source is already present."
            exit 0
          fi
          git commit -m "vendor: import CivilKit Calcpad core at a348ab7"
          git push origin "HEAD:${GITHUB_REF_NAME}"
