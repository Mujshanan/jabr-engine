name: Import pinned CivilKit Calcpad core

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-calcpad-core:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Jabr Engine
        uses: actions/checkout@v4
      - name: Import pinned upstream source
        run: bash scripts/vendor-calcpad.sh
      - name: Commit vendored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/civilkit-calcs
          if git diff --cached --quiet; then
            echo "Pinned Calcpad source is already present."
            exit 0
          fi
          git commit -m "vendor: import CivilKit Calcpad core"
          git push
